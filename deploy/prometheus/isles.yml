# Merge this scrape job into an existing private Prometheus deployment.
# Set ISLES_METRICS_TOKEN on Isles and mount that distinct read-only token
# as /etc/prometheus/isles-token. Never mount the administrative token.
rule_files:
  - isles-alerts.yml
scrape_configs:
  - job_name: mythic-isles
    scrape_interval: 20s
    scrape_timeout: 10s
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/isles-token
    static_configs:
      - targets: [isles:8095]
