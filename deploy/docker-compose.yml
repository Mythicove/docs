services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mirror
      POSTGRES_USER: mirror
      POSTGRES_PASSWORD: mirror
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mirror"]
      interval: 5s
      timeout: 3s
      retries: 10

  mirror:
    build: ./mythic-mirror
    environment:
      MIRROR_LISTEN_ADDR: ":8080"
      MIRROR_DATABASE_URL: "postgres://mirror:mirror@db:5432/mirror?sslmode=disable"
      MIRROR_KEY_PATH: "/data/private.pem"
      MIRROR_TEXTURES_DIR: "/data/textures"
      MIRROR_TEXTURES_BASE_URL: "${API_URL:-http://localhost:8080}"
      # OIDC issuer 必须对「浏览器」与「hoard 容器」同时可达：默认用 host.docker.internal
      # （Docker Desktop 宿主与容器均可解析；Linux 需 hoard 的 extra_hosts 兜底）。
      MIRROR_BASE_URL: "${OIDC_ISSUER_URL:-${API_URL:-http://localhost:8080}}"
      MIRROR_ADMIN_TOKEN: "${MIRROR_ADMIN_TOKEN:-}"
      MIRROR_WEB_URL: "${WEB_URL:-http://localhost:3101}"
      # CORS 白名单可独立于 WEB_URL 覆盖（逗号分隔多 origin：dev server + compose web 并存时）
      MIRROR_CORS_ORIGINS: "${MIRROR_CORS_ORIGINS:-${WEB_URL:-http://localhost:3101}}"
      # ---- 邮件（driver=log|smtp|resend；log=只写日志，默认）----
      MIRROR_MAIL_DRIVER: "${MIRROR_MAIL_DRIVER:-log}"
      MIRROR_SMTP_ADDR: "${MIRROR_SMTP_ADDR:-}"
      MIRROR_SMTP_FROM: "${MIRROR_SMTP_FROM:-}"
      MIRROR_SMTP_USER: "${MIRROR_SMTP_USER:-}"
      MIRROR_SMTP_PASS: "${MIRROR_SMTP_PASS:-}"
      MIRROR_RESEND_API_KEY: "${MIRROR_RESEND_API_KEY:-}"
      MIRROR_RESEND_FROM: "${MIRROR_RESEND_FROM:-}"
      # ---- 验证码（driver 留空=不启用；cap 实例地址同时被 web 构建复用，见下方 web.build.args）----
      MIRROR_CAPTCHA_DRIVER: "${MIRROR_CAPTCHA_DRIVER:-}"
      MIRROR_CAPTCHA_SITE_KEY: "${MIRROR_CAPTCHA_SITE_KEY:-}"
      MIRROR_CAPTCHA_SECRET: "${MIRROR_CAPTCHA_SECRET:-}"
      MIRROR_CAPTCHA_CAP_URL: "${MIRROR_CAPTCHA_CAP_URL:-}"
      # ---- 纹理存储（local|s3；s3 需补 ENDPOINT/BUCKET/密钥）----
      # 有代码默认值的变量必须在此显式兜底：compose 传空串会覆盖掉默认值
      MIRROR_STORAGE_DRIVER: "${MIRROR_STORAGE_DRIVER:-local}"
      MIRROR_S3_ENDPOINT: "${MIRROR_S3_ENDPOINT:-}"
      MIRROR_S3_REGION: "${MIRROR_S3_REGION:-auto}"
      MIRROR_S3_BUCKET: "${MIRROR_S3_BUCKET:-}"
      MIRROR_S3_ACCESS_KEY: "${MIRROR_S3_ACCESS_KEY:-}"
      MIRROR_S3_SECRET_KEY: "${MIRROR_S3_SECRET_KEY:-}"
      # ---- 多实例：Redis（共享缓存/限流）；CDN/云 LB 边缘网段（逗号分隔，见 docs/deploy）----
      MIRROR_REDIS_ADDR: "${MIRROR_REDIS_ADDR:-}"
      MIRROR_TRUSTED_PROXIES: "${MIRROR_TRUSTED_PROXIES:-}"
    volumes:
      - mirrordata:/data
    healthcheck:
      # alpine 基础镜像自带 busybox wget；wget 对 4xx/5xx 返回非零，正好用作健康语义
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy

  hoard:
    build: ./mythic-hoard
    environment:
      HOARD_LISTEN_ADDR: ":8081"
      # 与 mirror 同库时用 schema 隔离（hoard 对象全在 hoard schema），避免 users/sessions/files 同名碰撞
      HOARD_DATABASE_URL: "postgres://mirror:mirror@db:5432/mirror?sslmode=disable&options=-csearch_path%3Dhoard"
      HOARD_BASE_URL: "${API_URL:-http://localhost:8080}"
      HOARD_DATA_DIR: "/data/files"
      HOARD_ADMIN_TOKEN: "${HOARD_ADMIN_TOKEN:-}"
      HOARD_CORS_ORIGINS: "${HOARD_CORS_ORIGINS:-${WEB_URL:-http://localhost:3101}}"
      # OIDC SSO (Mirror as IdP); empty ISSUER disables.
      # Must exactly match mirror MIRROR_BASE_URL (iss verification);
      # hoard container must be able to reach it (hairpin).
      HOARD_OIDC_ISSUER: "${HOARD_OIDC_ISSUER:-${OIDC_ISSUER_URL:-}}"
      HOARD_OIDC_CLIENT_ID: "${HOARD_OIDC_CLIENT_ID:-}"
      HOARD_OIDC_CLIENT_SECRET: "${HOARD_OIDC_CLIENT_SECRET:-}"
      HOARD_OIDC_REDIRECT_URL: "${HOARD_OIDC_REDIRECT_URL:-}"
      # 服务端侧 IdP 基址（容器内可达）；issuer 保持浏览器面地址。
      # 默认直连 compose 内网的 mirror：走 host.docker.internal:8080 会绕到宿主发布的 caddy 端口，
      # 而 caddy 又要等 hoard healthy 才启动 → 启动死锁（hoard 在 discovery 阶段退出）。
      # rewrite transport 会保留 issuer 的 Host 头，故 iss 校验不受影响。
      HOARD_OIDC_INTERNAL_BASE_URL: "${HOARD_OIDC_INTERNAL_BASE_URL:-http://mirror:8080}"
      HOARD_ADMIN_SUBJECTS: "${HOARD_ADMIN_SUBJECTS:-}"
      # ---- mod 文件存储（local|s3）----
      HOARD_STORAGE_DRIVER: "${HOARD_STORAGE_DRIVER:-local}"
      HOARD_S3_ENDPOINT: "${HOARD_S3_ENDPOINT:-}"
      HOARD_S3_REGION: "${HOARD_S3_REGION:-auto}"
      HOARD_S3_BUCKET: "${HOARD_S3_BUCKET:-}"
      HOARD_S3_ACCESS_KEY: "${HOARD_S3_ACCESS_KEY:-}"
      HOARD_S3_SECRET_KEY: "${HOARD_S3_SECRET_KEY:-}"
      # ---- 搜索（pgtrgm|meili）与队列（inline|asynq；asynq 需 REDIS_ADDR）----
      HOARD_SEARCH_DRIVER: "${HOARD_SEARCH_DRIVER:-pgtrgm}"
      HOARD_MEILI_URL: "${HOARD_MEILI_URL:-}"
      HOARD_MEILI_API_KEY: "${HOARD_MEILI_API_KEY:-}"
      HOARD_QUEUE_DRIVER: "${HOARD_QUEUE_DRIVER:-inline}"
      HOARD_REDIS_ADDR: "${HOARD_REDIS_ADDR:-}"
      # ---- CDN/云 LB 边缘网段（逗号分隔，见 docs/deploy）----
      HOARD_TRUSTED_PROXIES: "${HOARD_TRUSTED_PROXIES:-}"
    volumes:
      - hoarddata:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy

  # 统一入口网关：单端口聚合 web 前端 + mirror + hoard（路径分流规则见 ./Caddyfile）。
  # 宿主反代/TLS 只需把域名整体指向 ${API_PORT}，无需自己写分流。
  # 分离部署（web 放 Pages 等独立宿主）时跳过 web 服务：
  #   docker compose up -d db mirror hoard caddy
  # 此时网关的 web 兜底路由返回 502，API 路径不受影响。
  caddy:
    image: caddy:2-alpine
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    healthcheck:
      # /healthz 由 mirror 应答；上游就绪前会得到 502（wget 判为不健康）
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    depends_on:
      mirror:
        condition: service_healthy
      hoard:
        condition: service_healthy

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: "${API_URL:-http://localhost:8080}"
        # web 的公开 origin（metadataBase/sitemap/robots）。不能传空串：
        # 空串会绕过代码里的 ?? 回退并让 new URL("") 抛错，故与本文件其余 WEB_URL 用同一默认。
        NEXT_PUBLIC_WEB_URL: "${WEB_URL:-http://localhost:3101}"
        NEXT_PUBLIC_LOCALE_PREFIX: "${LOCALE_PREFIX:-never}"
        NEXT_PUBLIC_INDEXABLE: "${INDEXABLE:-false}"
        # CSP 在构建期烘焙：driver=cap 时必须让 web 知道验证码实例地址，否则
        # connect-src/worker-src 会拦掉控件与 WASM。默认复用 mirror 的同一变量（两者必须一致）。
        CAPTCHA_CAP_URL: "${CAPTCHA_CAP_URL:-${MIRROR_CAPTCHA_CAP_URL:-}}"
    environment:
      # SSR/RSC 服务端取数走 compose 内部网络（经网关统一分流）
      API_URL_INTERNAL: "http://caddy:8080"
      # 非索引部署的 UA 黑名单开关（留空=跟随 INDEXABLE 推导）
      BLOCK_BOTS: "${BLOCK_BOTS:-}"
    ports:
      # 直连调试用；统一入口模式下浏览器流量走 caddy 网关，可不发布此端口
      - "${WEB_PORT:-3101}:3000"
    healthcheck:
      # 探 /icon.png：带点的路径被 proxy 的 matcher 排除，因而不受 BLOCK_BOTS 影响
      # （busybox wget 的 UA 会被反爬规则 403，探页面路径会误判为不健康）。
      # 用 127.0.0.1 而非 localhost：容器内 localhost 会先解析到 ::1，
      # 而 Next standalone 只监听 0.0.0.0（IPv4）→ 探针 connection refused。
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/icon.png"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
    depends_on:
      caddy:
        condition: service_healthy

volumes:
  pgdata:
  mirrordata:
  hoarddata:
