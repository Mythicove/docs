services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mirror
      POSTGRES_USER: mirror
      POSTGRES_PASSWORD: mirror
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mirror"]
      interval: 5s
      timeout: 3s
      retries: 10

  mirror:
    build: ./mythic-mirror
    environment:
      MIRROR_LISTEN_ADDR: ":8080"
      MIRROR_DATABASE_URL: "postgres://mirror:mirror@db:5432/mirror?sslmode=disable"
      MIRROR_KEY_PATH: "/data/private.pem"
      MIRROR_TEXTURES_DIR: "/data/textures"
      MIRROR_TEXTURES_BASE_URL: "${API_URL:-http://localhost:8080}"
      MIRROR_BASE_URL: "${API_URL:-http://localhost:8080}"
      MIRROR_WEB_URL: "${WEB_URL:-http://localhost:3101}"
      MIRROR_CORS_ORIGINS: "${WEB_URL:-http://localhost:3101}"
    volumes:
      - mirrordata:/data
    depends_on:
      db:
        condition: service_healthy

  hoard:
    build: ./mythic-hoard
    environment:
      HOARD_LISTEN_ADDR: ":8081"
      HOARD_DATABASE_URL: "postgres://mirror:mirror@db:5432/mirror?sslmode=disable"
      HOARD_BASE_URL: "${API_URL:-http://localhost:8080}"
      HOARD_DATA_DIR: "/data/files"
      HOARD_ADMIN_TOKEN: "${HOARD_ADMIN_TOKEN:-}"
      HOARD_CORS_ORIGINS: "${WEB_URL:-http://localhost:3101}"
    volumes:
      - hoarddata:/data
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - mirror
      - hoard

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: "${API_URL:-http://localhost:8080}"
    environment:
      # SSR/RSC 服务端取数走 compose 内部网络
      API_URL_INTERNAL: "http://caddy:8080"
    ports:
      - "${WEB_PORT:-3101}:3000"
    depends_on:
      - caddy

volumes:
  pgdata:
  mirrordata:
  hoarddata:
